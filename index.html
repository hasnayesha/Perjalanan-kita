<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ruang Kita ❤️</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e1b4b, #312e81, #4f46e5);
    }
    .hand {
      font-family: 'Gochi Hand', cursive;
    }
  </style>
</head>

<body class="text-white min-h-screen flex items-center justify-center p-4">

<div class="max-w-5xl w-full bg-black/60 backdrop-blur-xl rounded-3xl shadow-2xl p-8 space-y-10">

  <!-- HEADER -->
  <div class="text-center space-y-4">
    <h1 class="hand text-5xl text-pink-400">Cerita Kita</h1>
    <p class="text-gray-300">Timeline kecil berisi kenangan besar 🤍</p>

    <!-- NAV BUTTONS -->
    <div class="flex justify-center gap-4 mt-4">
      <button onclick="goToTimeline()"
        class="bg-indigo-500 hover:bg-indigo-600 px-6 py-2 rounded-full transition">
        🕰️ Timeline
      </button>
      <button onclick="goToMemoryWall()"
        class="bg-pink-500 hover:bg-pink-600 px-6 py-2 rounded-full transition">
        🖼️ Memory Wall
      </button>
    </div>
  </div>

  <!-- TIMELINE -->
  <div id="timeline-section">
    <h2 class="hand text-3xl text-indigo-300 mb-4 text-center">
      Waktu yang kita lalui
    </h2>
    <div id="timeline" class="flex flex-wrap justify-center gap-4"></div>
  </div>

  <!-- MEMORY WALL -->
  <div id="memory-section">
    <h2 id="memory-title" class="hand text-3xl text-pink-300 mb-4 text-center">
      Kenangan
    </h2>

    <div id="memory-wall" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6"></div>

    <!-- FORM -->
    <div class="bg-white/10 rounded-xl p-4 space-y-3">
      <h3 class="font-semibold">Tambah Kenangan</h3>

      <input id="memory-date" type="date"
        class="w-full p-2 rounded bg-black/40 border border-white/20"/>

      <textarea id="memory-text" placeholder="Tulis kenanganmu..."
        class="w-full p-2 rounded bg-black/40 border border-white/20"></textarea>

      <input id="memory-image" type="file" accept="image/*"
        class="w-full p-2 rounded bg-black/40 border border-white/20"/>

      <select id="memory-mood"
        class="w-full p-2 rounded bg-black/40 border border-white/20">
        <option value="❤️">❤️ Bahagia</option>
        <option value="🥺">🥺 Kangen</option>
        <option value="✨">✨ Spesial</option>
        <option value="😂">😂 Ketawa</option>
        <option value="😭">😭 Sedih</option>
      </select>

      <button onclick="addMemory()"
        class="bg-pink-500 hover:bg-pink-600 w-full py-2 rounded-lg font-bold">
        Simpan Kenangan
      </button>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="text-center hand text-2xl text-gray-200">
    Selamanya bersama 🤍
  </div>

</div>

<script>
/* ===== DATA ===== */

const defaultData = [
  { id: "first", title: "Awal", date: "2025-03", memories: [] },
  { id: "aksang", title: "Pertemuan pertama", date: "2025-09", memories: [] },
  { id: "jacob-fam", title: "Kajacob-Dejacob", date: "2025-09", memories: [] },
  { id: "dating", title: "Dating", date: "2025-10-21", memories: [] },
  { id: "ldr", title: "Libur tahun baru", date: "2026-01-01", memories: [] }
];

let timeline = JSON.parse(localStorage.getItem("timeline")) || defaultData;
let activeEventId = timeline[0].id;

/* ===== NAVIGATION ===== */

function goToTimeline() {
  document.getElementById("timeline-section")
    .scrollIntoView({ behavior: "smooth" });
}

function goToMemoryWall() {
  document.getElementById("memory-section")
    .scrollIntoView({ behavior: "smooth" });
}

/* ===== RENDER TIMELINE ===== */

function renderTimeline() {
  const el = document.getElementById("timeline");
  el.innerHTML = "";

  timeline.forEach(event => {
    const btn = document.createElement("button");
    btn.className = `
      px-4 py-2 rounded-xl border
      ${event.id === activeEventId ? "bg-indigo-500" : "bg-white/10"}
      hover:bg-indigo-400 transition
    `;
    btn.innerHTML = `
      <div class="font-bold">${event.title}</div>
      <div class="text-xs text-gray-200">${event.date}</div>
    `;
    btn.onclick = () => {
      activeEventId = event.id;
      renderTimeline();
      renderMemories();
    };
    el.appendChild(btn);
  });
}

/* ===== RENDER MEMORY ===== */

function renderMemories() {
  const event = timeline.find(e => e.id === activeEventId);
  document.getElementById("memory-title").innerText =
    `Kenangan: ${event.title}`;

  const wall = document.getElementById("memory-wall");
  wall.innerHTML = "";

  if (event.memories.length === 0) {
    wall.innerHTML = `
      <p class="col-span-2 text-center text-gray-300">
        Kenangan untuk momen ini akan kita isi pelan-pelan 🤍
      </p>`;
    return;
  }

  event.memories.forEach(mem => {
    const card = document.createElement("div");
    card.className = "bg-white/10 rounded-xl p-4 space-y-2";

    card.innerHTML = `
      ${mem.image ? `<img src="${mem.image}" class="w-full h-48 object-cover rounded-lg">` : ""}
      <div class="text-sm text-gray-300">${mem.date}</div>
      <div>${mem.text}</div>
      <div class="text-2xl">${mem.mood}</div>
    `;
    wall.appendChild(card);
  });
}

/* ===== ADD MEMORY ===== */

function addMemory() {
  const date = document.getElementById("memory-date").value;
  const text = document.getElementById("memory-text").value;
  const mood = document.getElementById("memory-mood").value;
  const file = document.getElementById("memory-image").files[0];

  if (!date || !text) return alert("Isi tanggal dan cerita 🤍");

  if (file) {
    const reader = new FileReader();
    reader.onload = () => saveMemory(date, text, mood, reader.result);
    reader.readAsDataURL(file);
  } else {
    saveMemory(date, text, mood, null);
  }
}

function saveMemory(date, text, mood, image) {
  const event = timeline.find(e => e.id === activeEventId);
  event.memories.push({ date, text, mood, image });

  localStorage.setItem("timeline", JSON.stringify(timeline));

  document.getElementById("memory-text").value = "";
  document.getElementById("memory-image").value = "";

  renderMemories();
}

/* ===== INIT ===== */

renderTimeline();
renderMemories();
</script>

</body>
</html>
