<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Cerita Kita ❤️</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter&display=swap');
body{
  font-family:'Inter';
  background:linear-gradient(135deg,#bfdbfe,#fbcfe8,#e0e7ff);
}
.hand{font-family:'Gochi Hand';}
.star{fill:#f9a8d4;cursor:pointer;transition:.3s}
.star:hover{fill:#93c5fd;r:10}
.line{stroke:rgba(255,255,255,.6);stroke-width:2}
</style>
</head>

<body class="text-white min-h-screen flex items-center justify-center p-6">

<div class="max-w-4xl w-full bg-white/20 backdrop-blur-xl rounded-3xl p-8 space-y-8">

<div class="text-center">
<h1 class="hand text-5xl text-pink-500">Cerita Kita</h1>
<p class="text-gray-700">Seperti bintang, setiap momen saling terhubung ✨</p>
</div>

<div class="flex justify-center gap-4">
<a href="memory.html" class="bg-pink-400 px-6 py-2 rounded-full">🖼️ Memory Wall</a>
<a href="add.html" class="bg-blue-400 px-6 py-2 rounded-full">➕ Tambah Kenangan</a>
</div>

<svg id="constellation" width="100%" height="300"></svg>

</div>

<script>
const defaultData = [
  { id:"awal", title:"Awal", date:"2025-03-03", memories:[] },
  { id:"meet", title:"Pertemuan Pertama", date:"2025-09-15", memories:[] },
  { id:"jacob", title: "Kajacob-Dejacob", date: "2025-09-26", memories:[]},
  { id:"dating", title:"Dating", date:"2025-10-21", memories:[] },
  { id:"ldr", title:"LDR", date:"2026-01-01", memories:[] }
];

// ⛔ JANGAN TIMPA JIKA SUDAH ADA
let timeline = JSON.parse(localStorage.getItem("timeline"));
if (!timeline) {
  localStorage.setItem("timeline", JSON.stringify(defaultData));
  timeline = defaultData;
}

/* ==== RASI BINTANG ==== */
const svg = document.getElementById("constellation");
const w = svg.clientWidth;
const h = 300;

timeline.forEach((e,i)=>{
  const x = (i+1)*(w/(timeline.length+1));
  const y = h/2 + Math.sin(i)*60;

  if(i>0){
    const px = i*(w/(timeline.length+1));
    const py = h/2 + Math.sin(i-1)*60;
    svg.innerHTML += `<line x1="${px}" y1="${py}" x2="${x}" y2="${y}" class="line"/>`;
  }

  svg.innerHTML += `
    <circle cx="${x}" cy="${y}" r="7" class="star"/>
    <text x="${x}" y="${y+25}" text-anchor="middle"
      fill="#ec4899" font-size="12">${e.title}</text>
  `;
});
</script>


</body>
</html>
