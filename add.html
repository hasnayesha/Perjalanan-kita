<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah Kenangan</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{
font-family:Inter;
background:linear-gradient(135deg,#bfdbfe,#fbcfe8,#e0e7ff);
}
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

<div class="bg-white/50 backdrop-blur-xl p-6 rounded-xl w-full max-w-md space-y-4 relative">

<a href="index.html" class="text-blue-500">← Kembali</a>
<h2 class="text-2xl font-bold text-center">Tambah Kenangan</h2>

<select id="event" class="w-full p-2 rounded">
</select>

<input id="date" type="date" class="w-full p-2 rounded">

<textarea id="text" placeholder="Tulis ceritanya..." class="w-full p-2 rounded"></textarea>

<input id="img" type="file" accept="image/*" class="w-full">

<select id="memory-mood"
  class="w-full p-2 rounded bg-black/40 border border-white/20">
  <option value="❤️">❤️ Bahagia</option>
  <option value="🥺">🥺 Kangen</option>
  <option value="✨">✨ Spesial</option>
  <option value="😂">😂 Ketawa</option>
  <option value="😭">😭 Sedih</option>
</select>

<button
onclick="addMemory()"
class="relative z-10 bg-pink-400 hover:bg-pink-500 w-full py-2 rounded-lg font-bold text-white">
Simpan
</button>

</div>

<script>
let timeline = JSON.parse(localStorage.getItem("timeline")) || [];

function addMemory(){
  const eventIndex = document.getElementById("event").value;
  const date = document.getElementById("date").value;
  const text = document.getElementById("text").value;
  const mood = document.getElementById("mood").value;
  const file = document.getElementById("img").files[0];

  if(!date || !text){
    alert("Tanggal dan cerita wajib 🤍");
    return;
  }

  const save = (image)=>{
    timeline[eventIndex].memories.push({date,text,mood,image});
    localStorage.setItem("timeline", JSON.stringify(timeline));
    window.location.href="memory.html";
  };

  if(file){
    const reader = new FileReader();
    reader.onload = ()=> save(reader.result);
    reader.readAsDataURL(file);
  } else {
    save(null);
  }
}
</script>

</body>
</html>
