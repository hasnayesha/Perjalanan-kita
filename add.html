<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tambah Kenangan</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-100 min-h-screen flex items-center justify-center">
<a href="index.html" class="text-pink-500">← Kembali</a>

<div class="bg-white p-6 rounded-xl w-96 space-y-4">

<h1 class="text-xl font-bold text-center">Tambah Kenangan</h1>

<select id="event" class="w-full p-2 border rounded">
  <option value="0">Awal Kita</option>
  <option value="1">Pertemuan Pertama</option>
  <option value="2">Kajacob-Dejacob</option>
  <option value="3">Dating</option>
  <option value="4">LDR</option>
</select>

<input id="date" type="date" class="w-full p-2 border rounded">
<textarea id="text" placeholder="Cerita..." class="w-full p-2 border rounded"></textarea>

<select id="mood" class="w-full p-2 border rounded">
 <option value="❤️">❤️ Bahagia</option>
  <option value="🥺">🥺 Kangen</option>
  <option value="✨">✨ Spesial</option>
  <option value="😂">😂 Ketawa</option>
  <option value="😭">😭 Sedih</option>
</select>

<input id="img" type="file" accept="image/*">

<button type="button"
onclick="addMemory()"
class="bg-pink-500 text-white w-full py-2 rounded">
Simpan
</button>

</div>

<script>
/* ===== PASTIKAN DATA ADA ===== */
let timeline = JSON.parse(localStorage.getItem("timeline"));

if(!timeline){
  timeline = [
    {id:"awal", title:"Awal Kita", memories:[]},
    {id:"meet", title:"Pertemuan Pertama", memories:[]},
    {id: "jacob", title:"Kajacob-Dejacob", memories:[]},
    {id: "dating", title:"Dating", memories:[]},
    {id: "ldr", title:"LDR", memories: []}
  ];
  localStorage.setItem("timeline", JSON.stringify(timeline));
}

/* ===== TAMBAH MEMORY ===== */
function addMemory(){
  const idx = document.getElementById("event").value;
  const date = document.getElementById("date").value;
  const text = document.getElementById("text").value;
  const mood = document.getElementById("mood").value;
  const file = document.getElementById("img").files[0];

  if(!date || !text){
    alert("Tanggal & cerita wajib");
    return;
  }

  const save = (image)=>{
    timeline[idx].memories.push({date,text,mood,image});
    localStorage.setItem("timeline", JSON.stringify(timeline));
    alert("TERSIMPAN ✅");
  };

  if(file){
    const reader = new FileReader();
    reader.onload = ()=> save(reader.result);
    reader.readAsDataURL(file);
  } else {
    save(null);
  }
}
</script>

</body>
</html>
